<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}} - 个人简历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .resume-container {
            max-width: 800px;
            margin: 30px auto;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .resume-header {
            background-color: #4a90e2;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .resume-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .resume-content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 22px;
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        
        .section-content {
            padding-left: 15px;
        }
        
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        
        li {
            margin-bottom: 5px;
        }
        
        h3 {
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555;
        }
        
        @media print {
            body {
                background-color: white;
            }
            
            .resume-container {
                box-shadow: none;
                margin: 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <div class="resume-header">
            <h1>{{name}}</h1>
            <h2>{{position}}</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <span>📱</span>
                    <span>{{phone}}</span>
                </div>
                <div class="contact-item">
                    <span>📧</span>
                    <span>{{email}}</span>
                </div>
            </div>
        </div>
        
        <div class="resume-content">
            {{content}}
        </div>
    </div>
</body>
</html>
